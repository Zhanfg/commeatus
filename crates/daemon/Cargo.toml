[package]
name = "commeatus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Commeatus proxy daemon and command-line interface"

[dependencies]
commeatus-core = { path = "../core", version = "=0.5.0-alpha.1" }
commeatus-dns = { path = "../dns", version = "=0.5.0-alpha.1" }
commeatus-transport = { path = "../transport", version = "=0.5.0-alpha.1" }
commeatus-compat = { path = "../compat", version = "=0.5.0-alpha.1" }
commeatus-platform = { path = "../platform", version = "=0.5.0-alpha.1" }
mio = { version = "1", features = ["net", "os-poll"] }
sha2 = "0.10"
socket2 = { version = "=0.6.5", features = ["all"] }
nix = { version = "=0.31.3", features = ["socket", "uio", "net"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "=0.13.2"
time = "=0.3.36"
