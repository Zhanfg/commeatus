name: v0.5 one-shot provider repair

on:
  push:
    branches:
      - refactor/v0.5-protocol-provider

permissions:
  contents: write

concurrency:
  group: v05-provider-repair-once
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/v0.5-protocol-provider
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply provider migration and verify stable
        run: |
          python3 scripts/v05_provider_repair.py
          if git grep -n 'ProxyProtocol' -- 'crates/**/*.rs'; then
            echo 'central ProxyProtocol enum/reference remains' >&2
            exit 1
          fi
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified migration and remove repair files
        run: |
          rm .github/workflows/v05-provider-repair-once.yml
          rm scripts/v05_provider_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'refactor(v0.5): migrate callers to protocol providers'
          git push origin HEAD:refactor/v0.5-protocol-provider
