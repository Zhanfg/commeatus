name: v0.6 one-shot native DNS resolver config verification

on:
  push:
    branches:
      - feat/v0.6-dns-native-config

permissions:
  contents: write

concurrency:
  group: v06-dns-native-config-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-dns-native-config
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply native resolver config migration
        run: |
          python3 scripts/v06_dns_config_patch.py
          python3 scripts/v06_dns_config_migrate.py
          grep -q 'pub const MAX_DNS_RESOLVERS: usize = 8;' crates/daemon/src/config.rs
          grep -q 'pub enum DnsResolverSummary' crates/daemon/src/config.rs
          grep -q 'resolver dot <ip:port> <server-name>' crates/daemon/src/config.rs
          grep -q 'dot_only_is_secure_only_without_implicit_system_fallback' crates/daemon/src/config.rs
          grep -q 'system_fallback_must_be_explicit_and_preserves_order' crates/daemon/src/config.rs
      - name: Format and check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test daemon config
        run: cargo test -p commeatus config::tests --locked -- --nocapture
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified resolver config and remove temporary files
        run: |
          rm .github/workflows/v06-dns-native-config-once.yml
          rm scripts/v06_dns_config_migrate.py
          rm scripts/v06_dns_config_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'feat(v0.6): add explicit native DNS resolver chain'
          git push origin HEAD:feat/v0.6-dns-native-config
