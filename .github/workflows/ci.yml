name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: CLI smoke
        run: |
          ./target/release/commeatus version
          ./target/release/commeatus platform
          ./target/release/commeatus check --config examples/commeatus.conf

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          toolchain: 1.85.0
      - name: Verify MSRV toolchain
        run: rustc +1.85.0 --version
      - name: Check MSRV
        run: cargo +1.85.0 check --workspace --all-targets --locked

  ebpf:
    name: eBPF compile prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Clang with BPF backend
        run: |
          for candidate in clang-20 clang-19 clang-18 clang-17 clang; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "BPF_CLANG=$candidate" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "no clang compiler found" >&2
          exit 1
      - name: Compile cgroup connect programs
        run: |
          mkdir -p build/ebpf
          "$BPF_CLANG" -target bpf -O2 -g \
            -I/usr/include/x86_64-linux-gnu \
            -c ebpf/flow.bpf.c -o build/ebpf/flow.bpf.o
      - name: Verify BPF ELF and sections
        run: |
          file build/ebpf/flow.bpf.o
          file build/ebpf/flow.bpf.o | grep -Eq 'eBPF|BPF'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'cgroup/connect4'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'cgroup/connect6'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'license'

  android-arm64:
    name: Android arm64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Configure Android NDK linker
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          linker="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$linker"
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build Android arm64
        run: cargo build --release --locked -p commeatus --target aarch64-linux-android
      - name: Verify Android binary
        run: |
          file target/aarch64-linux-android/release/commeatus
          file target/aarch64-linux-android/release/commeatus | grep -q 'ARM aarch64'

  package-smoke:
    name: Release package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Configure Android NDK linker
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          linker="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: |
          cargo build --release --locked -p commeatus
          cargo build --release --locked -p commeatus --target aarch64-linux-android
      - name: Package and verify archives
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          bash scripts/package-alpha.sh "$version" "$GITHUB_SHA" "$ANDROID_NDK_LATEST_HOME"
          ls -lh dist
          (cd dist && sha256sum -c SHA256SUMS)
