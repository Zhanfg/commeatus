name: v0.5 one-shot release prep verification

on:
  push:
    branches:
      - release/v0.5.0-alpha.1

permissions:
  contents: write

concurrency:
  group: v05-release-prep-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.5.0-alpha.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply v0.5 release metadata
        run: |
          python3 scripts/v05_release_prep_patch.py
          python3 scripts/v05_release_prep.py
          ! grep -R --line-number '0.4.0-alpha.1' Cargo.toml crates/*/Cargo.toml
          ! grep -q '0.4.0-alpha.1' README.md
          grep -q '0.5.0-alpha.1' README.md
          grep -q '^## 0.5.0-alpha.1 — 2026-08-16$' CHANGELOG.md
          grep -q 'native Trojan TCP/UDP' examples/trojan-outbound.conf
          grep -q 'v0.5.0-alpha.1' .github/workflows/release-v0.5-alpha.yml
          test -f docs/releases/0.5.0-alpha.1.md
      - name: Regenerate Cargo lockfile from v0.5 manifests
        run: |
          cargo check --workspace --all-targets
          ! grep -R --line-number '0.4.0-alpha.1' Cargo.toml crates/*/Cargo.toml
          grep -q 'version = "0.5.0-alpha.1"' Cargo.lock
      - name: Verify stable source
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify release CLI and examples
        run: |
          cargo build --release --locked -p commeatus
          ./target/release/commeatus version | grep -q '0.5.0-alpha.1'
          ./target/release/commeatus check --config examples/commeatus.conf
          ./target/release/commeatus check --config examples/proxy-outbound.conf
          ./target/release/commeatus check --config examples/tls-proxy-outbound.conf
          ./target/release/commeatus check --config examples/trojan-outbound.conf
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Verify release workflow transition
        run: |
          grep -q '^name: v0.4 release archive$' .github/workflows/release-v0.4-alpha.yml
          ! grep -q '^  push:$' .github/workflows/release-v0.4-alpha.yml
          grep -q '^name: Publish v0.5 alpha$' .github/workflows/release-v0.5-alpha.yml
          grep -q 'branches:' .github/workflows/release-v0.5-alpha.yml
          grep -q '0.5.0-alpha.1' docs/releases/0.5.0-alpha.1.md
      - name: Commit verified v0.5 release prep and remove temporary files
        run: |
          rm .github/workflows/v05-release-prep-once.yml
          rm scripts/v05_release_prep.py
          rm scripts/v05_release_prep_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'release: prepare v0.5.0-alpha.1'
          git push origin HEAD:release/v0.5.0-alpha.1
