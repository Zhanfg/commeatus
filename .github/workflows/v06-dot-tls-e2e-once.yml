name: v0.6 one-shot DoT TLS E2E verification

on:
  push:
    branches:
      - feat/v0.6-dns-answer-wire

permissions:
  contents: write

concurrency:
  group: v06-dot-tls-e2e-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-dns-answer-wire
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format and check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test verified DoT TLS path
        run: cargo test -p commeatus-dns dot_tls_tests --locked -- --nocapture
      - name: Test DNS crate
        run: cargo test -p commeatus-dns --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified DoT E2E and remove temporary workflow
        run: |
          rm .github/workflows/v06-dot-tls-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'test(v0.6): verify DoT over real TLS with reconnect'
          git push origin HEAD:feat/v0.6-dns-answer-wire
