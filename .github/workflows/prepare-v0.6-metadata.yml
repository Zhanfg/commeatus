name: Prepare v0.6 release metadata

on:
  push:
    branches:
      - release/v0.6.0-alpha.1

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update changelog and README status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = 'The project is pre-1.0. Native configuration and internal APIs may change between alpha releases.\n\n'
          block = '''## 0.6.0-alpha.1 — 2026-08-17

Sixth public alpha. This release adds verified DNS-over-TLS and turns the Android Root interception preview into a native TCP+UDP TPROXY path that still executes through the ordinary flow/policy/outbound runtime.

### Added

- typed DNS answer metadata and explicit secure resolver-chain semantics
- persistent verified DNS-over-TLS resolver and `examples/dot-resolver.conf`
- native `listen tproxy-tcp` transparent TCP ingress
- native `listen tproxy-udp` transparent UDP ingress
- IPv4/IPv6 original-destination recovery for transparent UDP through safe `nix` ancillary wrappers
- source-correct transparent UDP replies from the exact original remote `IP:port`
- listener-wide datagram readiness-token allocation for multiple transparent clients
- combined Android Root TCP+UDP lifecycle helper and configuration example
- privileged TCP and UDP TPROXY bind/namespace E2E in GitHub Actions
- ADR-0013 through ADR-0016 for DNS and transparent-interception ownership

### Changed

- TPROXY is treated strictly as an ingress adapter; transparent traffic uses the same native `FlowContext -> Policy -> ExecutionPlan -> OutboundRegistry` path as explicit proxy inbounds
- transparent UDP can execute DIRECT or any attached native datagram provider, including Trojan UDP, without protocol-name branches in the listener
- secure DNS fallback must be explicit rather than silently degrading to an insecure resolver
- workspace and internal crate versions advance to `0.6.0-alpha.1`

### Security and stability

- unsupported proxy UDP still fails locally and never falls back to DIRECT
- transparent UDP client count, route count, reply-socket cache, event drain and idle lifetime are bounded
- a newly observed transparent UDP client is rolled back immediately when its first outbound send fails instead of consuming a slot until idle expiry
- the new-client transition no longer relies on a production `expect()`
- root interception bypasses the root-owned daemon to avoid self-looping
- Android Root helper cleanup is scoped to Commeatus-owned chains and policy routes
- verified TLS/DoT certificate and server-name validation remains mandatory
- Rust 1.85, Android arm64, eBPF, release packaging and privileged TCP+UDP TPROXY proofs are release gates

### Known limitations

- no TUN backend yet
- eBPF remains a compile-verified prototype; no live loader/maps/redirect path yet
- no KernelSU/Magisk module packaging
- no Shadowsocks, VLESS, Hysteria2 or TUIC
- no endpoint groups, health selection, load balancing or adaptive/Smart routing
- no DoH, DoQ or Fake-IP
- no Clash/mihomo/sing-box import or compatible API
- bounded thread-per-session remains the transitional global TCP executor

'''
          if '## 0.6.0-alpha.1 — 2026-08-17' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('unexpected changelog preamble')
              text = text.replace(marker, marker + block)
              changelog.write_text(text)

          readme = Path('README.md')
          rtext = readme.read_text()
          old = '> **Status:** current `main` is **v0.6 development**; the latest public prerelease is `v0.5.0-alpha.1`. The tree remains experimental, not a production-ready replacement for mihomo or sing-box. Current main adds explicit verified DNS-over-TLS resolver chains on top of the v0.5 TCP/UDP, policy, Trojan, Android arm64, and eBPF prototype baseline.'
          new = '> **Status:** current tree targets **v0.6.0-alpha.1**. Commeatus remains experimental, not a production-ready replacement for mihomo or sing-box. This alpha combines the existing TCP/UDP and native Trojan baseline with verified DNS-over-TLS plus Android Root/Linux TPROXY TCP and UDP ingress.'
          if old in rtext:
              if rtext.count(old) != 1:
                  raise SystemExit('README status matched more than once')
              readme.write_text(rtext.replace(old, new))
          elif new not in rtext:
              raise SystemExit('unexpected README status')
          PY
      - name: Commit release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md
          git diff --cached --quiet && { echo 'metadata patch produced no diff' >&2; exit 1; }
          git commit -m 'docs(release): prepare v0.6 public metadata'
          git push origin HEAD:release/v0.6.0-alpha.1
