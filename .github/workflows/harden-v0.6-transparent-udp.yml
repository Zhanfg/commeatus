name: Harden v0.6 transparent UDP state

on:
  push:
    branches:
      - release/v0.6.0-alpha.1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply exact transparent UDP rollback patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/transparent_udp.rs')
          text = path.read_text()
          old = '''    if !clients.contains_key(&client) {
              cleanup_idle_clients(clients, token_clients, Instant::now());
              if clients.len() >= MAX_CLIENTS {
                  return false;
              }
              clients.insert(
                  client,
                  ClientState {
                      routes: DatagramRouteSet::new(),
                      last_activity: Instant::now(),
                  },
              );
          }
      
          let state = clients.get_mut(&client).expect("client inserted above");
          if state
              .routes
              .send_with(endpoint, target, payload, registry, tokens, |endpoint| {
                  outbounds.open_datagram(endpoint, Arc::clone(dns))
              })
              .is_err()
          {
              return false;
          }
          for token in state.routes.owned_tokens() {
              token_clients.insert(token, client);
          }
          true
          '''
          new = '''    let inserted = if !clients.contains_key(&client) {
              cleanup_idle_clients(clients, token_clients, Instant::now());
              if clients.len() >= MAX_CLIENTS {
                  return false;
              }
              clients.insert(
                  client,
                  ClientState {
                      routes: DatagramRouteSet::new(),
                      last_activity: Instant::now(),
                  },
              );
              true
          } else {
              false
          };
      
          let send_result = match clients.get_mut(&client) {
              Some(state) => state.routes.send_with(
                  endpoint,
                  target,
                  payload,
                  registry,
                  tokens,
                  |endpoint| outbounds.open_datagram(endpoint, Arc::clone(dns)),
              ),
              None => return false,
          };
          if send_result.is_err() {
              if inserted {
                  clients.remove(&client);
              }
              return false;
          }
          let Some(state) = clients.get(&client) else {
              return false;
          };
          for token in state.routes.owned_tokens() {
              token_clients.insert(token, client);
          }
          true
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact block once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
      - name: Verify hardening
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test -p commeatus --locked transparent_udp
          if grep -n 'expect("client inserted above")' crates/daemon/src/transparent_udp.rs; then
            echo 'production expect remains' >&2
            exit 1
          fi
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/daemon/src/transparent_udp.rs
          git diff --cached --quiet && { echo 'hardening patch produced no diff' >&2; exit 1; }
          git commit -m 'fix(v0.6): rollback failed new transparent UDP clients'
          git push origin HEAD:release/v0.6.0-alpha.1
