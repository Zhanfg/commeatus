name: v0.5 one-shot Trojan UDP E2E verification

on:
  push:
    branches:
      - feat/v0.5-trojan-udp

permissions:
  contents: write

concurrency:
  group: v05-trojan-udp-e2e-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.5-trojan-udp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native Trojan UDP E2E
        run: cargo test -p commeatus trojan_udp_e2e --locked -- --nocapture
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified proof and remove temporary workflow
        run: |
          rm .github/workflows/v05-trojan-udp-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'test(v0.5): verify native Trojan UDP end-to-end path'
          git push origin HEAD:feat/v0.5-trojan-udp
