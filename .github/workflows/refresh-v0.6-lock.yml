name: Refresh v0.6 release lock

on:
  push:
    branches:
      - release/v0.6.0-alpha.1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Refresh lock with Cargo
        run: cargo check --workspace --all-targets
      - name: Verify only Cargo.lock was generated by Cargo
        run: |
          git diff --exit-code -- Cargo.toml crates/core/Cargo.toml crates/dns/Cargo.toml crates/transport/Cargo.toml crates/platform/Cargo.toml crates/compat/Cargo.toml crates/daemon/Cargo.toml
          git diff -- Cargo.lock
          git diff --quiet -- Cargo.lock && { echo 'Cargo.lock did not change' >&2; exit 1; }
      - name: Commit generated lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(release): refresh v0.6 Cargo.lock'
          git push origin HEAD:release/v0.6.0-alpha.1
