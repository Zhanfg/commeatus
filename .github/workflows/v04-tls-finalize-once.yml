name: v0.4 one-shot TLS finalizer

on:
  push:
    branches:
      - feat/v0.4-tls-transport

permissions:
  contents: write

concurrency:
  group: v04-tls-finalize-once
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.4-tls-transport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify TLS implementation and E2E
        run: |
          cargo update
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Verify Rust 1.85 all-targets compatibility
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets
      - name: Commit verified lockfile and remove workflow
        run: |
          rm .github/workflows/v04-tls-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(v0.4): verify TLS protocol composition end to end"
          git push origin HEAD:feat/v0.4-tls-transport
