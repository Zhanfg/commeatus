name: v0.4 one-shot transport migration

on:
  push:
    branches:
      - feat/v0.4-transport-session

permissions:
  contents: write

concurrency:
  group: v04-transport-migrate-once
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.4-transport-session
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Migrate daemon to TransportSession
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected migration pattern missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "crates/daemon/src/config.rs",
              "use commeatus_dns::{DnsEngine, HostsTable, MAX_HOSTS_BYTES};\n\nuse crate::outbound::{OutboundRegistry, ProxyEndpointConfig, ProxyProtocol};",
              "use commeatus_dns::{DnsEngine, HostsTable, MAX_HOSTS_BYTES};\nuse commeatus_transport::TcpTransport;\n\nuse crate::outbound::{\n    OutboundRegistry, ProxyEndpointConfig, ProxyProtocol, TransportConfig,\n};",
          )
          replace(
              "crates/daemon/src/config.rs",
              "endpoint_configs.push(ProxyEndpointConfig {\n                    id,\n                    protocol,\n                    address,\n                });",
              "endpoint_configs.push(ProxyEndpointConfig {\n                    id,\n                    protocol,\n                    transport: TransportConfig::Tcp(TcpTransport::new(address)),\n                });",
          )

          replace(
              "crates/daemon/src/http_connect.rs",
              "    proxy::relay(client, remote)\n",
              "    remote.relay_to_client(client)\n",
          )
          replace(
              "crates/daemon/src/socks5.rs",
              "    proxy::relay(client, remote)\n",
              "    remote.relay_to_client(client)\n",
          )

          replace(
              "crates/daemon/src/outbound_e2e.rs",
              "use commeatus_dns::{DnsEngine, HostsTable};\n\nuse crate::{\n    config::ListenerProtocol,\n    outbound::{OutboundRegistry, ProxyEndpointConfig, ProxyProtocol},",
              "use commeatus_dns::{DnsEngine, HostsTable};\nuse commeatus_transport::TcpTransport;\n\nuse crate::{\n    config::ListenerProtocol,\n    outbound::{OutboundRegistry, ProxyEndpointConfig, ProxyProtocol, TransportConfig},",
          )
          replace(
              "crates/daemon/src/outbound_e2e.rs",
              "        OutboundRegistry::new(vec![ProxyEndpointConfig {\n            id,\n            protocol,\n            address,\n        }])",
              "        OutboundRegistry::new(vec![ProxyEndpointConfig {\n            id,\n            protocol,\n            transport: TransportConfig::Tcp(TcpTransport::new(address)),\n        }])",
          )

          replace(
              "crates/daemon/src/outbound.rs",
              "    io::{self, Read, Write},\n",
              "    io,\n",
          )

          p = Path("crates/daemon/src/proxy.rs")
          text = p.read_text()
          text = text.replace(
              "    net::{Shutdown, SocketAddr, TcpStream},\n    sync::atomic::{AtomicU64, Ordering},\n    thread,\n    time::{Duration, Instant},",
              "    net::{SocketAddr, TcpStream},\n    sync::atomic::{AtomicU64, Ordering},\n    time::{Duration, Instant},",
              1,
          )
          marker = "/// Copy bytes in both directions while preserving TCP half-close semantics.\npub fn relay"
          start = text.find(marker)
          end = text.find("\n#[cfg(test)]", start)
          if start < 0 or end < 0:
              raise SystemExit("proxy::relay removal markers missing")
          text = text[:start] + text[end + 1:]
          p.write_text(text)
          PY

          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Commit verified migration and remove one-shot workflow
        run: |
          rm .github/workflows/v04-transport-migrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(v0.4): route streams through transport sessions"
          git push origin HEAD:feat/v0.4-transport-session
