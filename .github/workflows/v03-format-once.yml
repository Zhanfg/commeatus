name: v0.3 one-shot rustfmt normalizer

on:
  push:
    branches:
      - feat/v0.3-outbound-runtime

permissions:
  contents: write

concurrency:
  group: v03-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.3-outbound-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Normalize Rust formatting and remove this workflow
        run: |
          cargo fmt --all
          rm .github/workflows/v03-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(v0.3): normalize Rust formatting"
          git push origin HEAD:feat/v0.3-outbound-runtime
