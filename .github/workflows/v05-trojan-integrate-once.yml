name: v0.5 one-shot Trojan integration

on:
  push:
    branches:
      - feat/v0.5-trojan-protocol

permissions:
  contents: write

concurrency:
  group: v05-trojan-integrate-once
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.5-trojan-protocol
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Integrate native Trojan config and verify E2E
        run: |
          python3 scripts/v05_trojan_integrate.py
          cargo update
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets compatibility
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified integration and remove temporary files
        run: |
          rm .github/workflows/v05-trojan-integrate-once.yml
          rm scripts/v05_trojan_integrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(v0.5): integrate native Trojan over TLS"
          git push origin HEAD:feat/v0.5-trojan-protocol
