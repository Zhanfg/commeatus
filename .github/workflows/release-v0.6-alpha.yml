name: Publish v0.6 alpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.6-alpha
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v0.6.0-alpha.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine v0.6 release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$version" = "0.6.0-alpha.1"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Commeatus $tag is already published; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.release_state.outputs.publish == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - name: Verify source before packaging
        if: steps.release_state.outputs.publish == 'true'
        run: |
          cargo fmt --all -- --check
          if grep -R --line-number --include='*.rs' 'ProxyProtocol' crates; then
            echo 'central ProxyProtocol enum/reference is forbidden; add a provider instead' >&2
            exit 1
          fi
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 MSRV
        if: steps.release_state.outputs.publish == 'true'
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Compile and verify eBPF prototype
        if: steps.release_state.outputs.publish == 'true'
        run: |
          compiler=""
          for candidate in clang-20 clang-19 clang-18 clang-17 clang; do
            if command -v "$candidate" >/dev/null 2>&1; then
              compiler="$candidate"
              break
            fi
          done
          test -n "$compiler"
          mkdir -p build/ebpf
          "$compiler" -target bpf -O2 -g \
            -I/usr/include/x86_64-linux-gnu \
            -c ebpf/flow.bpf.c -o build/ebpf/flow.bpf.o
          file build/ebpf/flow.bpf.o | grep -Eq 'eBPF|BPF'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'cgroup/connect4'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'cgroup/connect6'
          readelf -SW build/ebpf/flow.bpf.o | grep -q 'license'
      - name: Build Linux x86_64 and smoke configuration
        if: steps.release_state.outputs.publish == 'true'
        run: |
          cargo build --release --locked -p commeatus
          ./target/release/commeatus version | grep -q '0.6.0-alpha.1'
          ./target/release/commeatus platform
          ./target/release/commeatus check --config examples/commeatus.conf
          ./target/release/commeatus check --config examples/proxy-outbound.conf
          ./target/release/commeatus check --config examples/tls-proxy-outbound.conf
          ./target/release/commeatus check --config examples/trojan-outbound.conf
          ./target/release/commeatus check --config examples/dot-resolver.conf
          ./target/release/commeatus check --config examples/android-root-tproxy-tcp.conf
          ./target/release/commeatus check --config examples/android-root-tproxy.conf
          sh -n scripts/android-root-tproxy-tcp.sh
          sh -n scripts/android-root-tproxy.sh
      - name: Privileged transparent listener smoke
        if: steps.release_state.outputs.publish == 'true'
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            "$(command -v cargo)" test -p commeatus transparent_tcp::tests::privileged_transparent_bind_smoke --locked -- --ignored --exact
          sudo env PATH="$PATH" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            "$(command -v cargo)" test -p commeatus transparent_udp::tests::privileged_reply_socket_preserves_nonlocal_source_bind --locked -- --ignored --exact
      - name: TPROXY TCP namespace release E2E
        if: steps.release_state.outputs.publish == 'true'
        run: sudo bash scripts/ci/tproxy-tcp-netns-e2e.sh ./target/release/commeatus
      - name: TPROXY UDP namespace release E2E
        if: steps.release_state.outputs.publish == 'true'
        run: sudo bash scripts/ci/tproxy-udp-netns-e2e.sh ./target/release/commeatus
      - name: Configure Android NDK toolchain
        if: steps.release_state.outputs.publish == 'true'
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          bash scripts/android-ndk-env.sh "$ANDROID_NDK_LATEST_HOME" 29 >> "$GITHUB_ENV"
      - name: Build Android arm64
        if: steps.release_state.outputs.publish == 'true'
        run: |
          cargo build --release --locked -p commeatus --target aarch64-linux-android
          file target/aarch64-linux-android/release/commeatus
          file target/aarch64-linux-android/release/commeatus | grep -q 'ARM aarch64'
      - name: Package and verify release artifacts
        if: steps.release_state.outputs.publish == 'true'
        run: |
          bash scripts/package-alpha.sh \
            "${{ steps.release_state.outputs.version }}" \
            "$GITHUB_SHA" \
            "$ANDROID_NDK_LATEST_HOME"
          (cd dist && sha256sum -c SHA256SUMS)
          tar -tzf "dist/commeatus-${{ steps.release_state.outputs.version }}-linux-x86_64.tar.gz" \
            "commeatus-${{ steps.release_state.outputs.version }}-linux-x86_64/commeatus" >/dev/null
          tar -tzf "dist/commeatus-${{ steps.release_state.outputs.version }}-android-arm64.tar.gz" \
            "commeatus-${{ steps.release_state.outputs.version }}-android-arm64/commeatus" >/dev/null
      - name: Publish GitHub prerelease and tag exact commit
        if: steps.release_state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Commeatus $RELEASE_TAG" \
            --notes-file docs/releases/0.6.0-alpha.1.md
