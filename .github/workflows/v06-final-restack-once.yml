name: v0.6 one-shot final TPROXY restack verification

on:
  push:
    branches:
      - feat/v0.6-android-root-tproxy-tcp

permissions:
  contents: write

concurrency:
  group: v06-final-restack-once
  cancel-in-progress: true

jobs:
  verify:
    if: "${{ github.event.head_commit.message != 'chore(v0.6): finalize TPROXY restack metadata' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-android-root-tproxy-tcp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Apply listener grammar and ADR-0015 to current main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/daemon/src/config.rs')
          text = p.read_text()
          replacements = [
              (
                  'pub enum ListenerProtocol {\n    Socks5,\n    HttpConnect,\n}',
                  'pub enum ListenerProtocol {\n    Socks5,\n    HttpConnect,\n    TproxyTcp,\n}',
              ),
              (
                  '"listen syntax is `listen <socks5|http> <ip:port>`",',
                  '"listen syntax is `listen <socks5|http|tproxy-tcp> <ip:port>`",',
              ),
              (
                  '                    "socks5" => ListenerProtocol::Socks5,\n                    "http" => ListenerProtocol::HttpConnect,\n                    _ => {\n                        return Err(ConfigError::at(\n                            line_number,\n                            "listener protocol must be `socks5` or `http`",\n                        ));\n                    }',
                  '                    "socks5" => ListenerProtocol::Socks5,\n                    "http" => ListenerProtocol::HttpConnect,\n                    "tproxy-tcp" => ListenerProtocol::TproxyTcp,\n                    _ => {\n                        return Err(ConfigError::at(\n                            line_number,\n                            "listener protocol must be `socks5`, `http`, or `tproxy-tcp`",\n                        ));\n                    }',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one config match: {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          adr = Path('docs/adr/0015-tproxy-is-an-ingress-not-policy.md')
          adr.write_text('''# ADR-0015: TPROXY Is an Ingress, Not Policy

- Status: Accepted
- Date: 2026-08-16

## Context

Commeatus 0.5 can proxy real TCP and UDP when an application explicitly speaks SOCKS5/HTTP to the daemon, but Android Root cannot yet feed ordinary application connections into that runtime. A usable Root-first build needs transparent interception without moving routing semantics into shell/iptables code.

Linux/Android TPROXY preserves the packet destination and delivers it to a socket that opted into `IP_TRANSPARENT` / `IPV6_TRANSPARENT`. That makes it a suitable ingress mechanism: the original destination can be converted into the same native `Target` that explicit inbounds already feed into `FlowContext -> PolicyEngine -> ExecutionPlan`.

## Decision

TPROXY is an **ingress/platform mechanism only**.

The transparent listener may:

1. create a platform socket with the transparent socket option;
2. recover the kernel-preserved original destination;
3. convert that destination to native `Target`;
4. hand the flow to the ordinary policy and outbound execution path.

It must not contain protocol-name routing, hard-coded proxy selection, hidden DNS resolution, or DIRECT fallback logic.

The first implementation slice is TCP only. UDP transparent ingress is a separate slice because correct UDP reply-source/original-destination handling has different socket semantics and must not be faked by a TCP-shaped abstraction.

## Android Root lifecycle

The initial deployment helper owns only Commeatus-specific policy-routing entries and named netfilter chains. It:

- selects third-party Android app UIDs by default;
- leaves the root-owned daemon outside interception, preventing recursive interception without yet changing every outbound socket to carry `SO_MARK`;
- installs PREROUTING before enabling OUTPUT marking;
- rolls back only its own rules on failure/stop;
- refuses to reuse a non-empty chosen policy-routing table;
- keeps IPv6 enabled by default and fails explicitly if the requested IPv6 TPROXY surface is unavailable;
- does not touch UDP in the TCP preview.

A later supervisor can replace the shell lifecycle without changing flow/policy semantics.

## Consequences

### Positive

- real Android application TCP can enter the native runtime without a VPN/TUN userspace packet stack;
- DIRECT and Trojan TCP share the same policy/outbound implementation as explicit inbounds;
- no TPROXY-specific route decisions leak into the core;
- the listener uses safe `socket2` APIs, keeping daemon code free of new unsafe blocks;
- UDP can be implemented correctly rather than hidden behind a misleading partial abstraction.

### Negative / deferred

- this slice is not yet full-device proxying: UDP remains outside interception;
- daemon-owned outbound sockets rely on the preview process running as uid 0 while app interception defaults to uid 10000+; future privilege dropping requires explicit socket marks or a dedicated bypass identity;
- local Android netfilter/policy-routing availability is device/kernel dependent and must be probed before activation;
- process supervision is shell-based until the Root supervisor/package lifecycle exists.
''')

          index = Path('docs/adr/README.md')
          index_text = index.read_text()
          required = '- [ADR-0014: Secure DNS Fallback Must Be Explicit](0014-secure-dns-fallback-must-be-explicit.md)\n'
          if required not in index_text:
              raise SystemExit('current main ADR-0014 secure-DNS entry missing')
          line = '- [ADR-0015: TPROXY Is an Ingress, Not Policy](0015-tproxy-is-an-ingress-not-policy.md)\n'
          if line in index_text:
              raise SystemExit('TPROXY ADR-0015 unexpectedly already indexed')
          index.write_text(index_text.rstrip() + '\n' + line)
          PY

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/daemon/src/config.rs docs/adr/0015-tproxy-is-an-ingress-not-policy.md docs/adr/README.md | sort)"
          test "$changed" = "$expected"

      - name: Regenerate Cargo.lock from combined manifests
        run: |
          cargo check --workspace --all-targets
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' Cargo.lock crates/daemon/src/config.rs docs/adr/0015-tproxy-is-an-ingress-not-policy.md docs/adr/README.md | sort)"
          test "$changed" = "$expected"
          grep -q 'name = "socket2"' Cargo.lock
          grep -A8 -F 'name = "commeatus-dns"' Cargo.lock | grep -q 'commeatus-transport'

      - name: Verify stable combined tree
        run: |
          cargo fmt --all -- --check
          git diff --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked -p commeatus
          ./target/release/commeatus check --config examples/dot-resolver.conf
          ./target/release/commeatus check --config examples/android-root-tproxy-tcp.conf
          sh -n scripts/android-root-tproxy-tcp.sh

      - name: Verify privileged transparent listener
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            "$(command -v cargo)" test -p commeatus transparent_tcp::tests::privileged_transparent_bind_smoke --locked -- --ignored --exact

      - name: Verify full TPROXY namespace path
        run: sudo bash scripts/ci/tproxy-tcp-netns-e2e.sh ./target/release/commeatus

      - name: Verify Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked

      - name: Configure Android NDK toolchain
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          bash scripts/android-ndk-env.sh "$ANDROID_NDK_LATEST_HOME" 29 >> "$GITHUB_ENV"

      - name: Verify Android arm64
        run: |
          cargo build --release --locked -p commeatus --target aarch64-linux-android
          file target/aarch64-linux-android/release/commeatus | grep -q 'ARM aarch64'

      - name: Commit final restack metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/daemon/src/config.rs docs/adr/0015-tproxy-is-an-ingress-not-policy.md docs/adr/README.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' Cargo.lock crates/daemon/src/config.rs docs/adr/0015-tproxy-is-an-ingress-not-policy.md docs/adr/README.md | sort)"
          git commit -m 'chore(v0.6): finalize TPROXY restack metadata'
          git push origin HEAD:feat/v0.6-android-root-tproxy-tcp
