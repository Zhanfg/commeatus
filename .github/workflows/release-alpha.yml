name: Release alpha

on:
  push:
    tags:
      - v0.1.0-alpha.1

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v0.1.0-alpha.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - name: Verify release identity
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF_NAME" = "v0.1.0-alpha.1"
      - name: Verify source before packaging
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build Linux x86_64
        run: |
          cargo build --release --locked -p commeatus
          ./target/release/commeatus version
          ./target/release/commeatus check --config examples/commeatus.conf
      - name: Configure Android NDK linker
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          linker="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build Android arm64
        run: |
          cargo build --release --locked -p commeatus --target aarch64-linux-android
          file target/aarch64-linux-android/release/commeatus | grep -q 'ARM aarch64'
      - name: Package release artifacts
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          linux_dir="commeatus-$version-linux-x86_64"
          android_dir="commeatus-$version-android-arm64"
          mkdir -p "staging/$linux_dir" "staging/$android_dir" dist

          cp target/release/commeatus "staging/$linux_dir/"
          cp target/aarch64-linux-android/release/commeatus "staging/$android_dir/"
          for dir in "$linux_dir" "$android_dir"; do
            cp LICENSE README.md CHANGELOG.md "staging/$dir/"
            cp examples/commeatus.conf "staging/$dir/"
          done

          {
            echo "version=$version"
            echo "git_sha=$GITHUB_SHA"
            echo "rustc=$(rustc +stable --version)"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
          } > "staging/$linux_dir/BUILD-INFO.txt"
          cp "staging/$linux_dir/BUILD-INFO.txt" "staging/$android_dir/BUILD-INFO.txt"
          echo "android_ndk=$ANDROID_NDK_LATEST_HOME" >> "staging/$android_dir/BUILD-INFO.txt"
          echo "android_min_api=29" >> "staging/$android_dir/BUILD-INFO.txt"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C staging -cf - "$linux_dir" | gzip -n > "dist/$linux_dir.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C staging -cf - "$android_dir" | gzip -n > "dist/$android_dir.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          sha256sum -c dist/SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Commeatus $GITHUB_REF_NAME" \
            --notes-file docs/releases/0.1.0-alpha.1.md
