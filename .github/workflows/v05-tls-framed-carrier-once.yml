name: v0.5 one-shot framed TLS carrier

on:
  push:
    branches:
      - feat/v0.5-tls-framed-carrier

permissions:
  contents: write

concurrency:
  group: v05-tls-framed-carrier-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.5-tls-framed-carrier
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Add framed TLS carrier and verify stable
        run: |
          python3 scripts/v05_tls_framed_carrier.py
          grep -q 'pub fn connect_framed' crates/transport/src/tls.rs
          grep -q 'pub fn refresh_readiness' crates/transport/src/tls.rs
          grep -q 'framed_tls_session_is_readiness_driven_without_writable_spin' crates/transport/src/tls_tests.rs
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified carrier and remove temporary files
        run: |
          rm .github/workflows/v05-tls-framed-carrier-once.yml
          rm scripts/v05_tls_framed_carrier.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'feat(v0.5): add readiness-driven framed TLS carrier'
          git push origin HEAD:feat/v0.5-tls-framed-carrier
