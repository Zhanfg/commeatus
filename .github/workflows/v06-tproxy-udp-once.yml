name: v0.6 one-shot transparent UDP verification

on:
  push:
    branches:
      - feat/v0.6-android-root-tproxy-udp

permissions:
  contents: write

concurrency:
  group: v06-tproxy-udp-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-android-root-tproxy-udp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Apply transparent UDP implementation
        run: |
          python3 scripts/v06_tproxy_udp_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/daemon/src/transparent_udp.rs')
          text = p.read_text()
          old = 'net::{IpAddr, Ipv4Addr, Ipv6Addr, SocketAddr, UdpSocket as StdUdpSocket},'
          new = 'net::{SocketAddr, UdpSocket as StdUdpSocket},'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected transparent UDP import shape: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          test -f crates/daemon/src/transparent_udp.rs
          test -f scripts/android-root-tproxy.sh
          test -f examples/android-root-tproxy.conf
          grep -q 'TproxyUdp' crates/daemon/src/config.rs
          grep -q 'Ipv4OrigDstAddr' crates/daemon/src/transparent_udp.rs

      - name: Regenerate lockfile and compile
        run: |
          cargo check --workspace --all-targets
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          grep -q 'name = "nix"' Cargo.lock

      - name: Verify stable tree
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked -p commeatus
          ./target/release/commeatus check --config examples/android-root-tproxy.conf
          ./target/release/commeatus check --config examples/dot-resolver.conf
          sh -n scripts/android-root-tproxy.sh

      - name: Verify transparent UDP source bind
        run: |
          sudo env PATH="$PATH" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            "$(command -v cargo)" test -p commeatus transparent_udp::tests::privileged_reply_socket_preserves_nonlocal_source_bind --locked -- --ignored --exact

      - name: Verify full transparent UDP namespace path
        run: sudo bash scripts/ci/tproxy-udp-netns-e2e.sh ./target/release/commeatus

      - name: Verify existing TCP namespace path still works with unified helper source present
        run: sudo bash scripts/ci/tproxy-tcp-netns-e2e.sh ./target/release/commeatus

      - name: Verify Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked

      - name: Configure Android NDK toolchain
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          bash scripts/android-ndk-env.sh "$ANDROID_NDK_LATEST_HOME" 29 >> "$GITHUB_ENV"

      - name: Verify Android arm64
        run: |
          cargo build --release --locked -p commeatus --target aarch64-linux-android
          file target/aarch64-linux-android/release/commeatus | grep -q 'ARM aarch64'

      - name: Commit verified product files
        run: |
          rm scripts/v06_tproxy_udp_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/daemon scripts/android-root-tproxy.sh examples/android-root-tproxy.conf docs/android-root-tproxy-preview.md scripts/ci/tproxy-udp-netns-e2e.sh
          git diff --cached --quiet && exit 1
          git commit -m 'feat(v0.6): add Android Root TPROXY UDP ingress preview'
          git push origin HEAD:feat/v0.6-android-root-tproxy-udp
