name: v0.6 one-shot secure DNS docs verification

on:
  push:
    branches:
      - feat/v0.6-dns-native-config

permissions:
  contents: write

concurrency:
  group: v06-dns-docs-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-dns-native-config
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply secure DNS documentation migration
        run: |
          python3 scripts/v06_dns_docs_migrate.py
          grep -q 'current `main` is \*\*v0.6 development\*\*' README.md
          grep -q 'a DoT-only chain is therefore secure-only' README.md
          grep -q 'examples/dot-resolver.conf' README.md
          grep -q 'ADR-0014' README.md
          test -f docs/adr/0014-secure-dns-fallback-must-be-explicit.md
      - name: Verify source and config example
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo run --locked -p commeatus -- check --config examples/dot-resolver.conf
      - name: Commit verified docs and remove temporary files
        run: |
          rm .github/workflows/v06-dns-docs-once.yml
          rm scripts/v06_dns_docs_migrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'docs(v0.6): document explicit secure DNS resolver chains'
          git push origin HEAD:feat/v0.6-dns-native-config
