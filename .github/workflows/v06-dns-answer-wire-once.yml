name: v0.6 one-shot DNS answer and DoT verification

on:
  push:
    branches:
      - feat/v0.6-dns-answer-wire

permissions:
  contents: write

concurrency:
  group: v06-dns-answer-wire-once
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v0.6-dns-answer-wire
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply typed DNS answer and DoT migration
        run: |
          python3 scripts/v06_dns_answer_patch.py
          python3 scripts/v06_dns_answer_migrate.py
          grep -q 'pub use dot::DotResolver' crates/dns/src/lib.rs
          grep -q 'pub struct DnsAnswer' crates/dns/src/lib.rs
          grep -q 'resolver_zero_ttl_is_not_cached' crates/dns/src/lib.rs
          grep -q 'DNS compression pointer does not point backward' crates/dns/src/wire.rs
          grep -q 'pub fn resolve(&self, name: &str) -> Result<Vec<IpAddr>, DnsError>' crates/dns/src/lib.rs
          ! grep -q '\.expect(' crates/dns/src/dot.rs
      - name: Refresh lockfile for DNS transport dependency
        run: cargo check --workspace --all-targets
      - name: Format and check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test DNS crate
        run: cargo test -p commeatus-dns --locked -- --nocapture
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version | grep -q '^rustc 1\.85\.0 '
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified DNS foundation and remove temporary files
        run: |
          rm .github/workflows/v06-dns-answer-wire-once.yml
          rm scripts/v06_dns_answer_migrate.py
          rm scripts/v06_dns_answer_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'feat(v0.6): add typed DNS answers and persistent DoT resolver'
          git push origin HEAD:feat/v0.6-dns-answer-wire
