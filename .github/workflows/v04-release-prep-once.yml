name: v0.4 one-shot release preparation

on:
  push:
    branches:
      - release/v0.4.0-alpha.1

permissions:
  contents: write

concurrency:
  group: v04-release-prep-once
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.4.0-alpha.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Finalize version, docs and lockfile
        run: |
          python3 scripts/v04_release_docs.py
          cargo update
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 release candidate
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Verify release metadata
        run: |
          grep -q '^version = "0.4.0-alpha.1"$' Cargo.toml
          grep -q '^## 0.4.0-alpha.1' CHANGELOG.md
          grep -q 'Status:.*0.4.0-alpha.1' README.md
          test -f docs/releases/0.4.0-alpha.1.md
          test -f examples/tls-proxy-outbound.conf
          grep -q 'name: Publish v0.4 alpha' .github/workflows/release-v0.4-alpha.yml
      - name: Commit verified candidate and remove temporary files
        run: |
          rm .github/workflows/v04-release-prep-once.yml
          rm scripts/v04_release_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare Commeatus v0.4.0-alpha.1"
          git push origin HEAD:release/v0.4.0-alpha.1
