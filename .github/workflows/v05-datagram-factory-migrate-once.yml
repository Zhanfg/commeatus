name: v0.5 one-shot datagram factory migration

on:
  push:
    branches:
      - refactor/v0.5-proxy-datagram-factory

permissions:
  contents: write

concurrency:
  group: v05-datagram-factory-migrate-once
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/v0.5-proxy-datagram-factory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply migration and verify stable
        run: |
          python3 scripts/v05_datagram_factory_migrate.py
          ! grep -q 'DirectDatagramAssociation' crates/daemon/src/socks5.rs
          grep -q 'outbounds.open_datagram' crates/daemon/src/socks5.rs
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify Rust 1.85 all-targets
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit verified migration and remove temporary files
        run: |
          rm .github/workflows/v05-datagram-factory-migrate-once.yml
          rm scripts/v05_datagram_factory_migrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'refactor(v0.5): route datagrams through outbound factory'
          git push origin HEAD:refactor/v0.5-proxy-datagram-factory
