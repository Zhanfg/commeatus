# Commeatus v0.4 development example: protocol over verified TLS transport.
#
# `check` validates/compiles this configuration without opening the upstream
# connection. The TEST-NET-3 address below is documentation-only.
version 1

listen socks5 127.0.0.1:1080
listen http 127.0.0.1:8080

# Legacy v0.3 syntax remains equivalent to an explicit TCP transport.
endpoint plain-socks socks5 127.0.0.1:1081

# Protocol, carrier connection address, and TLS identity are separate fields.
endpoint secure-socks socks5 tls 203.0.113.7:443 proxy.example
endpoint secure-http http tls 203.0.113.8:443 office-proxy.example

rule proxy:secure-socks domain-suffix secure.example
rule proxy:secure-http domain-exact office.example

default direct
