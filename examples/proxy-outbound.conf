# Commeatus v0.3 development example: named proxy endpoint routing.
#
# This syntax is still pre-1.0 and may change. The upstream proxy address is
# intentionally an IP socket address in this first outbound-execution slice.

version 1

listen socks5 127.0.0.1:1080
listen http 127.0.0.1:8080

endpoint edge-socks socks5 127.0.0.1:1081
endpoint edge-http http 127.0.0.1:8081

# Policy references only the opaque endpoint identity. It does not know which
# proxy protocol implements that endpoint.
rule proxy:edge-socks domain-suffix proxied.example
rule proxy:edge-http domain-exact office.example

default direct
