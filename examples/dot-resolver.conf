# Commeatus v0.6 development example: explicit DNS-over-TLS resolver chain.
#
# No `resolver system` line is present, so this configuration is secure-only:
# if the DoT resolver fails, DNS resolution fails locally instead of silently
# falling back to the operating-system resolver.
#
# The DoT bootstrap endpoint must be a literal IP socket address. The TLS
# server name is separate and is verified by the normal WebPKI TLS path.

version 1

listen socks5 127.0.0.1:1080
listen http 127.0.0.1:8080

resolver dot 1.1.1.1:853 cloudflare-dns.com

# To allow an explicit system-DNS fallback after DoT, uncomment this line:
# resolver system

default direct
