# Commeatus v0.5 example: native Trojan TCP/UDP over verified TLS.
#
# `check` only parses/compiles this file; it does not connect to the TEST-NET-3
# upstream address. Replace all endpoint values before real use.
version 1

listen socks5 127.0.0.1:1080
listen http 127.0.0.1:8080

# The password is read from the source config while compiling the candidate.
# The compiled native endpoint shares the derived Trojan verifier between its
# stream and datagram providers; the raw source password is not retained by those
# active provider objects. A future secret-source mechanism is still required for
# production secret management.
endpoint trojan-demo trojan tls 203.0.113.10:443 trojan.example change-me

rule proxy:trojan-demo domain-suffix trojan-route.example

default direct
