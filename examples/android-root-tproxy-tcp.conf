# Android Root v0.6 development preview: transparent TCP + native Trojan.
# Replace the TEST-NET-3 endpoint, TLS name, and password before real use.
# UDP is intentionally NOT intercepted by this preview yet.
version 1

# Optional explicit local proxy for debugging/tools.
listen socks5 127.0.0.1:1080

# Root TPROXY ingress. The companion script routes selected Android app TCP
# here while preserving the original destination address.
listen tproxy-tcp 127.0.0.1:12948
listen tproxy-tcp [::1]:12948

endpoint edge trojan tls 203.0.113.10:443 trojan.example change-me

# Keep local loopback outside the remote proxy path.
rule direct cidr 127.0.0.0/8
rule direct cidr ::1/128

default proxy:edge
