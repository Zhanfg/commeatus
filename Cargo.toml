[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/compat",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Zhanfg/commeatus"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
